<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e5c4a" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Wanderlog is an offline-first travel journal. Pin the places you visit, keep the photos and stories, and watch your journey grow on a map."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wanderlog" />
    <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Wanderlog — Travel Journal</title>
    <style>
      /* First-paint background so the app never flashes white on a slow device. */
      html {
        background: #f5efe2;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #0f1714;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Wanderlog needs JavaScript enabled to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
